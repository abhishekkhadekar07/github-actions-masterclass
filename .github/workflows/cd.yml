name: abhishek CD

on:
  workflow_run:
    workflows: ["abhishek CI"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    # Repo variable DEPLOY_ENABLED gates this job. Set it to "true" in
    # Settings → Variables → Actions when you have a live EC2 + valid
    # EC2_HOST / EC2_USER / EC2_SSH_KEY secrets. Otherwise CD skips
    # cleanly so pushes don't red-X the Actions tab.
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
              git clone https://github.com/abhishekkhadekar07/github-actions-masterclass.git
            cd ~/github-actions-masterclass
            git pull origin main
            docker compose pull
            docker compose up -d
            docker image prune -f

