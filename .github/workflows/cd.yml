name: abhishek CD

on:
  workflow_run:
    workflows: ["abhishek CI"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    # Repo variable DEPLOY_ENABLED gates this job. Set it to "true" in
    # Settings → Variables → Actions when you have a live EC2 + valid
    # EC2_HOST / EC2_USER / EC2_SSH_KEY secrets. Otherwise CD skips
    # cleanly so pushes don't red-X the Actions tab.
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ -d ~/github-actions-masterclass ] && [ ! -d ~/github-actions-masterclass/.git ]; then
              echo "ERROR: ~/github-actions-masterclass already exists but is not a git checkout. Move or remove it, then rerun the workflow."
              exit 1
            fi
            if [ ! -d ~/github-actions-masterclass ]; then
              git clone https://github.com/abhishekkhadekar07/github-actions-masterclass.git ~/github-actions-masterclass
            fi
            cd ~/github-actions-masterclass
            git pull origin master
            if [ ! -f .env ]; then
              echo "ERROR: ~/github-actions-masterclass/.env is missing. Create it with DOCKERHUB_USERNAME and DB credentials."
              exit 1
            fi
            docker compose pull
            docker compose up -d --no-build
